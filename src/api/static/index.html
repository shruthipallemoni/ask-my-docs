<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask My Docs — GitHub API Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161b;
    --bg-raised: #1b1e26;
    --border: #2a2e38;
    --text: #ede9e3;
    --text-dim: #8b93a7;
    --accent: #4fd1c5;
    --accent-dim: #2e5a56;
    --user-bubble: #262a34;
    --error: #e8817a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header h1 .accent { color: var(--accent); }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    max-width: 380px;
  }

  .empty-state .prompt-glyph {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent);
    font-size: 22px;
    margin-bottom: 10px;
    display: block;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg-row.user { align-items: flex-end; }
  .msg-row.assistant { align-items: flex-start; }

  .bubble {
    max-width: 88%;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg-row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--border);
  }

  .msg-row.assistant .bubble {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
  }

  .msg-row.assistant .bubble.error {
    border-left-color: var(--error);
    color: var(--error);
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    max-width: 88%;
  }

  .source-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--accent-dim);
    color: var(--accent);
    letter-spacing: -0.01em;
  }

  .status-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    padding: 3px 6px;
  }

  .status-pill.verified { color: var(--accent); }

  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: pulse 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.25; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1); }
  }

  footer {
    flex-shrink: 0;
    padding: 16px 24px 22px;
    border-top: 1px solid var(--border);
  }

  form {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 4px 4px 14px;
  }

  form:focus-within {
    border-color: var(--accent);
  }

  .prompt-symbol {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent);
    font-size: 14px;
    flex-shrink: 0;
  }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    padding: 10px 0;
  }

  input[type="text"]::placeholder { color: var(--text-dim); }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 13px;
    background: var(--accent);
    color: #0d1512;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  button:disabled {
    background: var(--border);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  button:not(:disabled):hover { opacity: 0.9; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Ask My<span class="accent">Docs</span></h1>
  <p>GitHub REST API assistant — every claim tied to a real, cited endpoint</p>
</header>

<main id="chat">
  <div class="empty-state" id="empty-state">
    <span class="prompt-glyph">&gt;_</span>
    Ask something like "how do I create an issue" or "what scopes do I need to delete a repo"
  </div>
</main>

<footer>
  <form id="chat-form">
    <span class="prompt-symbol">&gt;</span>
    <input type="text" id="question-input" placeholder="Ask a question about GitHub's REST API..." autocomplete="off">
    <button type="submit" id="send-btn">Ask</button>
  </form>
</footer>

<script>
  const API_URL = '/query';
  const chat = document.getElementById('chat');
  const emptyState = document.getElementById('empty-state');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');

  function addUserMessage(text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = 'typing-row';
    row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function addAssistantMessage(data) {
    const row = document.createElement('div');
    row.className = 'msg-row assistant';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = data.answer;
    row.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'meta-row';

    const statusPill = document.createElement('span');
    statusPill.className = 'status-pill' + (data.citation_valid ? ' verified' : '');
    statusPill.textContent = data.citation_valid ? '✓ citations verified' : '⚠ citation unverified';
    meta.appendChild(statusPill);

    const latencyPill = document.createElement('span');
    latencyPill.className = 'status-pill';
    latencyPill.textContent = `${data.latency_seconds}s`;
    meta.appendChild(latencyPill);

    (data.sources || []).forEach(src => {
      const pill = document.createElement('span');
      pill.className = 'source-pill';
      pill.textContent = src;
      meta.appendChild(pill);
    });

    row.appendChild(meta);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function addErrorMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.innerHTML = `<div class="bubble error">${escapeHtml(text)}</div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addUserMessage(question);
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    addTypingIndicator();

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      removeTypingIndicator();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addErrorMessage(err.detail || `Request failed (${res.status}). Is the API running?`);
      } else {
        const data = await res.json();
        addAssistantMessage(data);
      }
    } catch (err) {
      removeTypingIndicator();
      addErrorMessage('Could not reach the API. Make sure it\'s running (uvicorn src.api.main:app) and Qdrant is up.');
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.focus();
</script>

</body>
</html>
